services:
  todo-app:
    build: .
    image: todo-app:latest
    container_name: todo-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATA_DIR=/app/data
      - FLASK_DEBUG=false
      - PYTHONUNBUFFERED=1
    volumes:
      - todo-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  todo-data:
