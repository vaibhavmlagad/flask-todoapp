<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskly — Todo List</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <div class="backdrop"></div>

  <header class="app-header">
    <div class="brand">
      <div class="brand-logo">✓</div>
      <div>
        <h1>Taskly</h1>
        <p class="tagline">Plan your day, one task at a time</p>
      </div>
    </div>
    <div class="stats-bar" id="statsBar">
      <div class="stat-pill">
        <span class="stat-num" id="statTotal">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-pill">
        <span class="stat-num" id="statActive">0</span>
        <span class="stat-label">Active</span>
      </div>
      <div class="stat-pill done">
        <span class="stat-num" id="statCompleted">0</span>
        <span class="stat-label">Done</span>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section class="composer-card">
      <form id="todoForm" autocomplete="off">
        <div class="composer-row">
          <input type="text" id="titleInput" placeholder="What needs to get done?" maxlength="200" required>
          <select id="priorityInput" title="Priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <button type="submit" class="btn-primary">
            <span class="plus-icon">+</span> Add Task
          </button>
        </div>
        <textarea id="descriptionInput" placeholder="Add a description (optional)" maxlength="1000" rows="2"></textarea>
      </form>
    </section>

    <section class="toolbar">
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <div class="toolbar-right">
        <input type="search" id="searchInput" placeholder="Search tasks…">
        <button class="btn-ghost" id="clearCompletedBtn">Clear completed</button>
      </div>
    </section>

    <section class="list-wrap">
      <ul id="todoList" class="todo-list"></ul>
      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-emoji">🌤️</div>
        <h3>Nothing here yet</h3>
        <p>Add your first task above and get things moving.</p>
      </div>
    </section>
  </main>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModalOverlay">
  <div class="modal-card">
    <h2>Edit Task</h2>
    <form id="editForm">
      <label>Title</label>
      <input type="text" id="editTitle" maxlength="200" required>
      <label>Description</label>
      <textarea id="editDescription" rows="3" maxlength="1000"></textarea>
      <label>Priority</label>
      <select id="editPriority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelEditBtn">Cancel</button>
        <button type="submit" class="btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
